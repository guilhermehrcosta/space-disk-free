name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./Scripts/build-app.sh
      - run: ./Scripts/make-dmg.sh
      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/*.dmg --clobber
